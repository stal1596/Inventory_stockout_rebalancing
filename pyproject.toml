[project]
name = "stockout"
version = "0.1.0"
description = "Stockout risk: data readiness, canonical model, and survival-analysis foundations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Stage 2 only. Nothing in this repo imports these yet.
survival = [
    "lifelines>=0.29",
    "scipy>=1.13",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
