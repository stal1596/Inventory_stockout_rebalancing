[project]
name = "stockout"
version = "0.1.0"
description = "Stockout risk: data readiness, canonical model, and survival-analysis foundations"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is driven by lifelines 0.30.x, which requires pandas<3.0.
    # The core package itself is compatible with pandas 3; only this pin holds
    # it back, so it can be lifted as soon as lifelines supports pandas 3.
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
survival = [
    "lifelines>=0.30",
    "scipy>=1.13",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # pandas 2.3 internals vs numpy 2.5; not raised by this package's own code.
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
